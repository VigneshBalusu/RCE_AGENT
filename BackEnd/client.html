<!DOCTYPE html>
<html>
<head><title>College Bot</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
  button { padding: 12px 24px; font-size: 16px; margin: 8px; border-radius: 8px; border: none; cursor: pointer; }
  #startbtn { background: #4CAF50; color: white; }
  #stopbtn  { background: #f44336; color: white; display: none; }
  #log { background: #f5f5f5; padding: 12px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 16px; }
  #status { padding: 10px; border-radius: 8px; margin: 12px 0; font-weight: bold; background: #ffebee; color: #c62828; }
  .ok { background: #e8f5e9 !important; color: #2e7d32 !important; }
  .speaking { background: #fff3e0 !important; color: #e65100 !important; }
</style>
</head>
<body>
<h2>🎓 College Bot</h2>
<div id="status">Disconnected</div>
<button id="startbtn" onclick="start()">🎤 Connect & Speak</button>
<button id="stopbtn"  onclick="stop()">🔴 Disconnect</button>
<div id="log"></div>

<script>
let ws, micCtx, stream, proc, srcNode;
let spkCtx = null;
let nextPlayTime = 0;

function log(m){ const d=document.getElementById('log'); d.innerHTML+=m+'<br>'; d.scrollTop=d.scrollHeight; }
function status(m,cls){ const s=document.getElementById('status'); s.textContent=m; s.className=cls||''; }

function encodeVarint(value) {
  const buf = [];
  while (value > 0x7F) { buf.push((value & 0x7F) | 0x80); value >>>= 7; }
  buf.push(value & 0x7F);
  return new Uint8Array(buf);
}
function encodeLengthDelimited(fieldNum, bytes) {
  return concatBytes(encodeVarint((fieldNum << 3) | 2), encodeVarint(bytes.length), bytes);
}
function encodeUint32Field(fieldNum, value) {
  return concatBytes(encodeVarint((fieldNum << 3) | 0), encodeVarint(value));
}
function concatBytes(...arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const a of arrays) { out.set(a, offset); offset += a.length; }
  return out;
}
function encodeAudioFrame(pcmInt16Buffer, sampleRate, numChannels) {
  const audioBytes = new Uint8Array(pcmInt16Buffer);
  const audioField      = encodeLengthDelimited(3, audioBytes);
  const sampleRateField = encodeUint32Field(4, sampleRate);
  const numChanField    = encodeUint32Field(5, numChannels);
  const audioRawFrame   = concatBytes(audioField, sampleRateField, numChanField);
  return encodeLengthDelimited(2, audioRawFrame);
}

function decodeAudioFromFrame(data) {
  const bytes = new Uint8Array(data);
  let i = 0;
  function readVarint() {
    let result = 0, shift = 0;
    while (i < bytes.length) {
      const b = bytes[i++];
      result |= (b & 0x7F) << shift;
      if (!(b & 0x80)) break;
      shift += 7;
    }
    return result >>> 0;
  }
  function skipField(wireType) {
    if (wireType === 0) readVarint();
    else if (wireType === 2) { const l = readVarint(); i += l; }
    else if (wireType === 5) i += 4;
    else if (wireType === 1) i += 8;
  }
  while (i < bytes.length) {
    const tag = readVarint();
    const fieldNum = tag >>> 3;
    const wireType = tag & 0x7;
    if (fieldNum === 2 && wireType === 2) {
      const frameLen = readVarint();
      const frameEnd = i + frameLen;
      while (i < frameEnd) {
        const innerTag = readVarint();
        const innerField = innerTag >>> 3;
        const innerWire  = innerTag & 0x7;
        if (innerField === 3 && innerWire === 2) {
          const audioLen = readVarint();
          const pcm = bytes.slice(i, i + audioLen);
          i += audioLen;
          return pcm;
        } else { skipField(innerWire); }
      }
    } else { skipField(wireType); }
  }
  return null;
}

function playPCM(pcmBytes) {
  const i16 = new Int16Array(pcmBytes.buffer || pcmBytes);
  if (i16.length === 0) return;
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  const buf = spkCtx.createBuffer(1, f32.length, 22050);
  buf.copyToChannel(f32, 0);
  const src = spkCtx.createBufferSource();
  src.buffer = buf;
  src.connect(spkCtx.destination);

  const now = spkCtx.currentTime;

  // ✅ FIX: if nextPlayTime has drifted too far ahead (>0.5s), reset it
  // This prevents buffer pile-up across multiple responses
  if (nextPlayTime < now || nextPlayTime > now + 1) {
    nextPlayTime = now + 1; // small initial delay to avoid underrun
  }

  src.start(nextPlayTime);
  nextPlayTime += buf.duration;

  status('🔊 Bot speaking...', 'speaking');
  src.onended = () => {
    if (nextPlayTime <= spkCtx.currentTime + 0.05) {
      status('🎤 Listening...', 'ok');
    }
  };
}
async function start() {
  try {
    status('Requesting mic...', 'speaking');
    stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
    micCtx = new AudioContext({ sampleRate: 16000 });

    // ✅ Create speaker AudioContext HERE during user gesture so browser allows it
    spkCtx = new AudioContext({ sampleRate: 22050 });
    await spkCtx.resume(); // ✅ Force resume — critical for Chrome
    nextPlayTime = 0;
    log('✅ Mic granted, audio context ready');

    ws = new WebSocket('ws://localhost:8000/ws/voice');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      log('✅ Connected');
      status('🎤 Connected — speak now!', 'ok');
      document.getElementById('startbtn').style.display = 'none';
      document.getElementById('stopbtn').style.display = 'inline';
      startMic();
    };

    ws.onmessage = (e) => {
      if (e.data instanceof ArrayBuffer) {
        const pcm = decodeAudioFromFrame(e.data);
        if (pcm && pcm.length > 0) {
          log('🔊 ' + pcm.length + ' PCM bytes received');
          playPCM(pcm);
        } else {
          log('⚠️ Frame with no audio (' + e.data.byteLength + ' bytes)');
        }
      } else {
        log('📝 ' + String(e.data).substring(0, 100));
      }
    };

    ws.onclose = (e) => { log('🔌 Closed ' + e.code); status('Disconnected'); };
    ws.onerror = () => log('❌ WebSocket error');
  } catch (err) { log('❌ ' + err.message); status('Error'); }
}

function startMic() {
  srcNode = micCtx.createMediaStreamSource(stream);
  proc = micCtx.createScriptProcessor(512, 1, 1);
  proc.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
    ws.send(encodeAudioFrame(i16.buffer, 16000, 1));
  };
  srcNode.connect(proc);
  proc.connect(micCtx.destination);
  log('🎙️ Mic live — speak now!');
}

function stop() {
  if (proc) { proc.disconnect(); proc = null; }
  if (srcNode) { srcNode.disconnect(); srcNode = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (spkCtx) { spkCtx.close(); spkCtx = null; }
  if (ws) ws.close();
  nextPlayTime = 0;
  document.getElementById('startbtn').style.display = 'inline';
  document.getElementById('stopbtn').style.display = 'none';
  status('Disconnected');
  log('🛑 Stopped');
}
</script>
</body>
</html>
